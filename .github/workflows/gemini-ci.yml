name: Gemini CLI Smoke Test

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini CLI Smoke Test
        id: gemini_test
        uses: google-github-actions/run-gemini-cli@main
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: latest
          prompt: |
            You are performing a CI smoke test.
            Reply strictly with a JSON object only, with keys:
            {
              "status": "Gemini CLI works",
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref_name || github.ref }}"
            }
            Output JSON **only** to stdout, no other text.

      - name: Print Gemini CLI output
        run: |
          echo "=== Gemini CLI STDOUT ==="
          if [[ -f "${RUNNER_TEMP}/gemini-out"* ]]; then
            cat ${RUNNER_TEMP}/gemini-out*
          else
            echo "No stdout log found"
          fi
          echo "=== Step outputs ==="
          echo "${{ steps.gemini_test.outputs.gemini_response }}"
          echo "=== End of Output ==="
