name: Gemini CLI Direct Smoke Test

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Gemini CLI
        run: |
          npm install -g @google/gemini-cli

      - name: Run Gemini CLI directly
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=== Gemini CLI Execution ==="
          npx @google/gemini-cli \
            --prompt "You are performing a CI smoke test. Reply strictly with a JSON object containing keys: status, repository, branch" \
            --output-format json
          echo "=== End of Execution ==="
