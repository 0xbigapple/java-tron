name: Gemini CLI Strict JSON Smoke Test

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

jobs:
  gemini-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Gemini CLI (smoke test)
        uses: google-github-actions/run-gemini-cli@main
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are performing a CI smoke test.
            Reply strictly with a JSON object only, without any extra text.
            Include these keys:
            {
              "status": "Gemini CLI works",
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref_name || github.ref }}"
            }

      - name: Print Gemini CLI output
        run: |
          echo "=== Gemini CLI STDOUT ==="
          echo "${{ steps.gemini_test.outputs.gemini_response }}"
          echo "=== End of Gemini CLI Output ==="
